        import { getFirestore, doc, getDoc, addDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ค่าตั้งต้น Firebase ของคุณ (สามารถเปลี่ยนได้ถ้าสร้างโปรเจกต์ใหม่)

            messagingSenderId: "913418532683",
            appId: "1:913418532683:web:058ae422ef17f023509ace"
        };

        window.initFirebase = async () => {
            try {
                const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                return { db, auth, doc, getDoc, addDoc, setDoc, deleteDoc, collection, getDocs, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged };
            } catch (error) {
                console.error("Firebase init error:", error);
                return null;
            }
        };
    </script>

    <script>
        window.CASE_STORAGE_KEY = 'ssd_investigation_cases_v2';
        window.getLocalCases = function() {
            try { return JSON.parse(localStorage.getItem(window.CASE_STORAGE_KEY)) || []; } 
            catch (e) { return []; }
        };
        window.saveLocalCase = function(caseData, caseId) {
            const list = window.getLocalCases();
            const id = caseId || ('local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
            const now = Date.now();
            const index = list.findIndex(item => item.id === id);
            const saved = { ...((index >= 0) ? list[index] : {}), ...caseData, id, updatedAt: now, storage: 'local' };
            if (!saved.createdAt) saved.createdAt = now;
            if (index >= 0) list[index] = saved; else list.unshift(saved);
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(list));
            return saved;
        };
        window.deleteLocalCase = function(caseId) {
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(window.getLocalCases().filter(item => item.id !== caseId)));
        };
    </script>

        function ChecklistApp({ user, onLogout }) {
            const [activeTab, setActiveTab] = React.useState('checklist');
            const [currentCaseId, setCurrentCaseId] = React.useState(null);
            const [targetName, setTargetName] = React.useState('');
            const [caseNumber, setCaseNumber] = React.useState('');
            const [officerName, setOfficerName] = React.useState('');
            const [formData, setFormData] = React.useState({});
            const [categories, setCategories] = React.useState(initialCategories);
            const [customFieldInputs, setCustomFieldInputs] = React.useState({});
            const [isSaving, setIsSaving] = React.useState(false);
            
            const [smartText, setSmartText] = React.useState('');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [isSearching, setIsSearching] = React.useState(false);
            const [allCasesHistory, setAllCasesHistory] = React.useState([]);
            
            const [isSharedView, setIsSharedView] = React.useState(false);
            const [isSharing, setIsSharing] = React.useState(false);
            
            const [modalConfig, setModalConfig] = React.useState({ isOpen: false, title: '', message: '' });
            const [confirmModal, setConfirmModal] = React.useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const showModal = (title, message) => setModalConfig({ isOpen: true, title, message });
            const closeModal = () => setModalConfig({ isOpen: false, title: '', message: '' });
            const showConfirm = (title, message, onConfirm) => setConfirmModal({ isOpen: true, title, message, onConfirm });
            const closeConfirm = () => setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });

            const fetchAllHistory = async () => {
                try {
                    const localList = window.getLocalCases().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                    
                    const fb = await window.initFirebase();
                    if (!fb || !user) {
                         setAllCasesHistory(localList);
                         return;
                    }
                    
                    // ระบบใหม่: ดึงข้อมูลจากฐานข้อมูล "ส่วนตัว" ของ User คนนี้เท่านั้น
                    const privateCasesRef = fb.collection(fb.db, 'users', user.uid, 'cases');
                    const snapshot = await fb.getDocs(privateCasesRef);
                    const remoteList = [];
                    snapshot.forEach(docSnap => {
                        remoteList.push({ id: docSnap.id, ...docSnap.data(), storage: 'firebase' });
                    });
                    remoteList.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
                    
                    setAllCasesHistory(remoteList.length > 0 ? remoteList : localList);
                } catch (e) {
                    console.error(e);
                    setAllCasesHistory(window.getLocalCases());
                }
            };

            React.useEffect(() => {
                const loadSharedData = async () => {
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        const sharedCaseId = urlParams.get('caseId');

                        if (sharedCaseId) {
                            try {
                                const fb = await window.initFirebase();
                                if (!fb) { showModal('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้'); return; }
                                
                                // สำหรับการเปิดลิงก์แชร์ ต้องไปอ่านที่ Public Data เสมอ
                                const docRef = fb.doc(fb.db, 'public_cases', sharedCaseId);
                                const docSnap = await fb.getDoc(docRef);

                                if (docSnap.exists()) {
                                    const data = docSnap.data();
                                    setCurrentCaseId(sharedCaseId);
                                    setTargetName(data.targetName || '');
                                    setCaseNumber(data.caseNumber || '');
                                    setOfficerName(data.officerName || '');
                                    setFormData(data.formData || {});
                                    if (data.categories) setCategories(data.categories);
                                    
                                    setIsSharedView(true);
                                    setActiveTab('mindmap');
                                    showModal('โหลดข้อมูลสำเร็จ', 'เปิดข้อมูลร่วมกันแล้ว — ผู้ใช้งานที่ได้รับลิงก์สามารถแก้ไขและบันทึกข้อมูลได้');
                                } else {
                                    showModal('ไม่พบข้อมูล', 'ลิงก์แชร์นี้อาจหมดอายุหรือไม่พบในระบบ');
                                }
                            } catch (error) {
                                showModal('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลที่แชร์ได้: ' + error.message);
                            }
                        } else {
                            await fetchAllHistory();
                        }
                    } catch (error) {
                        setIsSharedView(false);
                        await fetchAllHistory();
                    }
                };
                loadSharedData();
            }, [user]);

            const handleAddValue = (fieldId) => {
                const currentValues = formData[fieldId] || [''];
                setFormData({ ...formData, [fieldId]: [...currentValues, ''] });
            };
            const handleRemoveValue = (fieldId, indexToRemove) => {
                const currentValues = formData[fieldId] || [];
                const newValues = currentValues.filter((_, idx) => idx !== indexToRemove);
                setFormData({ ...formData, [fieldId]: newValues });
            };
            const handleChangeValue = (fieldId, index, newValue) => {
                const currentValues = formData[fieldId] || [''];
                const updatedValues = [...currentValues];
                updatedValues[index] = newValue;
                setFormData({ ...formData, [fieldId]: updatedValues });
            };
            const handleCustomFieldInputChange = (catId, value) => {
                setCustomFieldInputs({ ...customFieldInputs, [catId]: value });
            };
            const handleAddCustomField = (catId) => {
                const newLabel = customFieldInputs[catId];
                if (!newLabel || newLabel.trim() === '') return;
                const newFieldId = `custom_${catId}_${Date.now()}`;
                const updatedCategories = categories.map(cat => {
                    if (cat.id === catId) {
                        return { ...cat, fields: [...cat.fields, { id: newFieldId, label: newLabel.trim() }] };
                    }
                    return cat;
                });
                setCategories(updatedCategories);
                setFormData({ ...formData, [newFieldId]: [''] });
                setCustomFieldInputs({ ...customFieldInputs, [catId]: '' });
            };

            const handleSmartExtract = () => {
                if(!smartText.trim()) {
                    showModal('แจ้งเตือน', 'กรุณาวางข้อความที่ต้องการแยกลงในกล่องก่อนครับ');
                    return;
                }
                
                let extractedCount = 0;
                const newFormData = { ...formData };

                const addData = (fieldId, value) => {
                    if(!newFormData[fieldId]) newFormData[fieldId] = [];
                    newFormData[fieldId] = newFormData[fieldId].filter(v => v !== '');
                    if(!newFormData[fieldId].includes(value)) {
                        newFormData[fieldId].push(value);
                        extractedCount++;
                    }
                };

                const idMatch = smartText.match(/\b\d{1}-?\d{4}-?\d{5}-?\d{2}-?\d{1}\b/g) || smartText.match(/\b\d{13}\b/g);
                if(idMatch) idMatch.forEach(id => addData('1_3', id));

                const phoneMatch = smartText.match(/\b0[689]\d{1}-?\d{3}-?\d{4}\b/g) || smartText.match(/\b0[689]\d{8}\b/g);
                if(phoneMatch) phoneMatch.forEach(ph => addData('9_3', ph));

                const nameMatch = smartText.match(/(?:นาย|นาง|นางสาว)\s+[ก-๙]+\s+[ก-๙]+/g);
                if(nameMatch) nameMatch.forEach(name => addData('1_1', name));

                const carMatch = smartText.match(/[1-9]?[ก-ฮ]{1,2}\s*\d{1,4}\s*(?:กทม|กรุงเทพมหานคร|[ก-๙]+)/g);
                if(carMatch) carMatch.forEach(car => addData('6_1', car));

                const bankMatch = smartText.match(/\b\d{3}-?\d{1}-?\d{5}-?\d{1}\b/g) || smartText.match(/\b\d{10,12}\b/g);
                if(bankMatch) bankMatch.forEach(bank => addData('11_2', bank));

                if(extractedCount > 0) {
                    setFormData(newFormData);
                    setSmartText('');
                    showModal('ดึงข้อมูลสำเร็จ! ✨', `สกัดข้อมูลอัตโนมัติได้ ${extractedCount} รายการ\nนำข้อมูลไปจัดลง Checklist ให้เรียบร้อยแล้ว`);
                } else {
                    showModal('ไม่พบข้อมูล', 'ไม่พบรูปแบบข้อมูลที่ระบบรู้จักในข้อความนี้\n(รองรับ: ชื่อ-สกุล, เลขบัตรปชช, เบอร์โทร, ทะเบียนรถ, เลขบัญชี)');
                }
            };

            const handleSave = async () => {
                if (!targetName.trim() && !caseNumber.trim()) {
                    showModal('แจ้งเตือน', 'กรุณากรอก "ชื่อ-สกุล เป้าหมาย" หรือ "เลขคดี / หมายจับ" ก่อนบันทึก');
                    return;
                }
                setIsSaving(true);
                try {
                    const now = Date.now();
                    const localId = currentCaseId || ('local_' + now + '_' + Math.random().toString(36).slice(2, 8));
                    const payload = { targetName: targetName.trim(), caseNumber: caseNumber.trim(), officerName: officerName.trim(), formData, categories, updatedAt: now };

                    // Save local backup always
                    const localSaved = window.saveLocalCase(payload, localId);
                    setCurrentCaseId(currentCaseId || localSaved.id);

                    const fb = await window.initFirebase();
                    let onlineSaved = false;
                    
                    if (fb && user) {
                        if (isSharedView) {
                            // บันทึกทับลิงก์แชร์เดิม
                            const publicDocRef = fb.doc(fb.db, 'public_cases', currentCaseId);
                            await fb.setDoc(publicDocRef, payload, { merge: true });
                            onlineSaved = true;
                        } else {
                            // บันทึกลง Private Workspace ของผู้ใช้
                            const privateCasesRef = fb.collection(fb.db, 'users', user.uid, 'cases');
                            if (currentCaseId && !String(currentCaseId).startsWith('local_')) {
                                const docRef = fb.doc(fb.db, 'users', user.uid, 'cases', currentCaseId);
                                await fb.setDoc(docRef, payload, { merge: true });
                                onlineSaved = true;
                            } else {
                                const docRef = await fb.addDoc(privateCasesRef, { ...payload, createdAt: now });
                                setCurrentCaseId(docRef.id);
                                onlineSaved = true;
                            }
                        }
                    }
                    if (onlineSaved) {
                        await fetchAllHistory();
                    } else {
                        setAllCasesHistory(prev => {
                            const exists = prev.some(item => item.id === localSaved.id);
                            const next = exists ? prev.map(item => item.id === localSaved.id ? localSaved : item) : [localSaved, ...prev];
                            return next.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                        });
                    }
                    setIsSaving(false);
                    showModal('บันทึกสำเร็จ', onlineSaved ? 'บันทึกข้อมูลลงฐานข้อมูลส่วนตัวสำเร็จ' : 'บันทึกข้อมูลลงในเครื่องแล้ว');
                } catch (error) {
                    setIsSaving(false); 
                    let errorMsg = 'ไม่สามารถบันทึกได้: ' + error.message;
                    if (error.code === 'permission-denied') {
                        errorMsg = 'เกิดข้อผิดพลาดด้านสิทธิ์ (Permission Denied)\n\nกรุณาตรวจสอบ Firestore Rules ใน Firebase Console ของคุณว่าตั้งค่า match /users/{userId}/cases/... ถูกต้องหรือไม่';
                    }
                    showModal('เกิดข้อผิดพลาด', errorMsg);
                }
            };

            const handleLoadCaseFromHistory = (caseData, tab = 'checklist') => {

                setCurrentCaseId(caseData.id || null); setTargetName(caseData.targetName || '');
                setCaseNumber(caseData.caseNumber || ''); setOfficerName(caseData.officerName || '');
                setFormData(caseData.formData || {}); if (caseData.categories) setCategories(caseData.categories);
                setActiveTab(tab); showModal('โหลดข้อมูลสำเร็จ', `ดึงข้อมูลของ "${caseData.targetName || 'ไม่ระบุชื่อ'}" เรียบร้อยแล้ว`);

                    try {
                        window.deleteLocalCase(caseId);

                        if (fb && !String(caseId).startsWith('local_') && user) {
                            const docRef = fb.doc(fb.db, 'users', user.uid, 'cases', caseId);
                            await fb.deleteDoc(docRef);
                        }
                        setAllCasesHistory(prev => prev.filter(item => item.id !== caseId));
                        setSearchResults(prev => prev.filter(item => item.id !== caseId));

                        showModal('ลบสำเร็จ', 'ลบประวัติเป้าหมายออกจากระบบเรียบร้อยแล้ว');
                    } catch (error) {
                        showModal('เกิดข้อผิดพลาด', 'ลบข้อมูลไม่ได้: ' + error.message);
                    }
                });
            };

            const handleShareOnline = async () => {
                setIsSharing(true);
                try {
                    const fb = await window.initFirebase();
                    if (!fb || !user) { showModal('เตือน', 'ต้องเข้าสู่ระบบก่อนแชร์ออนไลน์'); setIsSharing(false); return; }
                    
                    const payload = { targetName, caseNumber, officerName, formData, categories, updatedAt: Date.now(), sharedBy: user.email };
                    let sharedDocRef;
                    
                    if (isSharedView && currentCaseId && !String(currentCaseId).startsWith('local_')) {
                        // อัพเดตลิงก์แชร์เดิม
                        sharedDocRef = fb.doc(fb.db, 'public_cases', currentCaseId);
                        await fb.setDoc(sharedDocRef, payload, { merge: true });
                    } else {
                        // สร้างลิงก์แชร์ใหม่ใน Public
                        payload.createdAt = Date.now();
                        sharedDocRef = await fb.addDoc(fb.collection(fb.db, 'public_cases'), payload);
                    }
                    
                    const shareUrl = `${window.location.origin}${window.location.pathname}?caseId=${sharedDocRef.id}`;
                    try { await navigator.clipboard.writeText(shareUrl); } catch (_) {
                        const textArea = document.createElement('textarea'); textArea.value = shareUrl;
                        document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); textArea.remove();
                    }
                    showModal('สร้างลิงก์แชร์สำเร็จ! 🔗', `คัดลอกลิงก์เรียบร้อยแล้ว ส่งให้เพื่อนร่วมงานได้เลย\n\n${shareUrl}`);
                } catch (error) {

                } finally { setIsSharing(false); }

            const handleSearchDatabase = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) { showModal('แจ้งเตือน', 'กรุณากรอกคำค้นหา'); return; }
                setIsSearching(true);
                try {
                    let source = window.getLocalCases();
                    const fb = await window.initFirebase();
                    if (fb && user) {
                        const privateCasesRef = fb.collection(fb.db, 'users', user.uid, 'cases');
                        const snapshot = await fb.getDocs(privateCasesRef);
                        source = [];
                        snapshot.forEach(docSnap => source.push({ id: docSnap.id, ...docSnap.data(), storage: 'firebase' }));
                    }
                    const queryStr = searchQuery.toLowerCase().trim();
                    const results = source.filter(data => {
                        const t = (data.targetName||'').toLowerCase(), c = (data.caseNumber||'').toLowerCase(), o = (data.officerName||'').toLowerCase();
                        const id = ((data.formData && data.formData['1_3']) || []).join(' ').toLowerCase();
                        return t.includes(queryStr) || c.includes(queryStr) || o.includes(queryStr) || id.includes(queryStr);
                    });
                    setSearchResults(results);
                    if (results.length === 0) showModal('ไม่พบข้อมูล', `ไม่พบเป้าหมายที่ตรงกับ "${searchQuery}"`);

            };

                    tempCanvas.width = canvas.width * 2; tempCanvas.height = canvas.height * 2;
                    const ctx = tempCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const pdfWrapper = document.createElement('div');
                    pdfWrapper.style.padding = '12px'; pdfWrapper.style.background = '#fff';
                    pdfWrapper.innerHTML = `<div style="text-align:center;margin-bottom:10px;"><h2 style="margin:0;font-size:22px;">Mind Map - ${targetName||'เป้าหมาย'}</h2><p style="margin:0;color:#666;">เลขคดี: ${caseNumber||'-'}</p></div>`;

                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center"><p className="text-blue-600 font-semibold mb-1">ความคืบหน้า</p><p className="text-3xl font-bold text-blue-800">{progress}%</p></div>
                                <div className="bg-green-50 p-4 rounded-xl border border-green-100 text-center"><p className="text-green-600 font-semibold mb-1">ข้อมูลที่ได้</p><p className="text-3xl font-bold text-green-800">{filledItems} / {totalItems}</p></div>
                                <div className="bg-purple-50 p-4 rounded-xl border border-purple-100 text-center"><p className="text-purple-600 font-semibold mb-1">หมวดหมู่</p><p className="text-3xl font-bold text-purple-800">{activeCategories} / {categories.length}</p></div>
                            </div>
                            <h3 className="font-bold text-lg mb-4 text-gray-800">รายละเอียดที่พบ</h3>
                            <div className="space-y-4">
                                {categories.map(cat => {
                                    const filledFields = cat.fields.filter(f => (formData[f.id] || []).filter(v => v && String(v).trim()).length > 0);
                                    if (filledFields.length === 0) return null;
                                    return (
                                        <div key={cat.id} className="border rounded-lg p-4 bg-gray-50">
                                            <h4 className="font-bold text-gray-700 mb-2">{cat.title}</h4>
                                            <ul className="list-disc list-inside text-sm text-gray-600 space-y-1 ml-2">
                                                {filledFields.map(f => <li key={f.id}><span className="font-semibold">{f.label}:</span> {(formData[f.id]||[]).filter(v=>v).join(', ')}</li>)}
                                            </ul>
                                        </div>
                                    );
                                })}
                                {activeCategories === 0 && <div className="text-center text-gray-500 py-8 italic">ยังไม่มีข้อมูล</div>}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderSearch = () => (
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 space-y-6">
                    <div>
                        <h2 className="text-lg md:text-xl font-bold text-gray-800 mb-1">🔍 ค้นหาประวัติเป้าหมาย</h2>
                        <p className="text-xs md:text-sm text-gray-500">ค้นหาด้วยชื่อ เลขคดี หรือบัตรประชาชนในคลังส่วนตัว</p>
                    </div>
                    <form onSubmit={handleSearchDatabase} className="flex flex-col sm:flex-row gap-3">
                        <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="พิมพ์คำค้นหา..." className="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-base focus:ring-2 focus:ring-blue-500" />
                        <button type="submit" disabled={isSearching} className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg w-full sm:w-auto">
                            {isSearching ? 'ค้นหา...' : '🔎 ค้นหา'}
                        </button>
                    </form>
                    <div className="mt-6 border-t pt-6">
                        <h3 className="font-bold text-gray-700 mb-4">ผลลัพธ์ ({searchResults.length})</h3>
                        {searchResults.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {searchResults.map((item, idx) => (
                                    <div key={idx} className="border border-blue-100 bg-blue-50/50 p-4 rounded-xl flex flex-col justify-between gap-4">
                                        <div>
                                            <h4 className="font-bold text-lg text-gray-900">{item.targetName || 'ไม่ระบุชื่อ'}</h4>
                                            <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-semibold mt-1 inline-block">คดี: {item.caseNumber || '-'}</span>
                                            <p className="text-xs text-gray-600 mt-2">จนท: {item.officerName || '-'}</p>
                                        </div>
                                        <div className="flex flex-wrap gap-2 justify-end">
                                            <button onClick={() => requestEditCase(item)} className="bg-yellow-500 hover:bg-yellow-600 text-white text-xs font-semibold py-1.5 px-3 rounded-lg">✏️ แก้ไข</button>
                                            <button onClick={() => requestDeleteCase(item.id, item.targetName)} className="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1.5 px-3 rounded-lg">🗑️ ลบ</button>
                                            <button onClick={() => handleLoadCaseFromHistory(item)} className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1.5 px-3 rounded-lg">📂 เปิดดู</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-8 text-gray-400 bg-gray-50 rounded-xl border border-dashed">ไม่มีผลการค้นหา</div>
                        )}
                    </div>
                </div>
            );

            const renderHistory = () => (
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
                        <h2 className="text-lg md:text-xl font-bold text-gray-800">🕒 ประวัติทั้งหมด</h2>
                        <button onClick={fetchAllHistory} className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2 px-4 rounded-lg w-full sm:w-auto">🔄 รีเฟรช</button>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700">
                                    <th className="p-3 border-b text-sm">เลขคดี</th><th className="p-3 border-b text-sm">เป้าหมาย</th>
                                    <th className="p-3 border-b text-sm">ผู้รับผิดชอบ</th><th className="p-3 border-b text-sm">ข้อมูล</th>
                                    <th className="p-3 border-b text-sm text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                {allCasesHistory.length > 0 ? (
                                    allCasesHistory.map((item, idx) => (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-3 border-b text-sm font-medium">{item.caseNumber || '-'}</td>
                                            <td className="p-3 border-b text-sm font-semibold">{item.targetName || 'ไม่ระบุชื่อ'}</td>
                                            <td className="p-3 border-b text-sm text-gray-600">{item.officerName || '-'}</td>
                                            <td className="p-3 border-b text-sm text-gray-600">{Object.values(item.formData || {}).flat().filter(v=>v).length} รายการ</td>
                                            <td className="p-3 border-b text-center space-x-2 whitespace-nowrap">
                                                <button onClick={() => requestEditCase(item)} className="bg-yellow-500 hover:bg-yellow-600 text-white px-2 py-1 rounded text-xs font-semibold">แก้ไข</button>
                                                <button onClick={() => requestDeleteCase(item.id, item.targetName)} className="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs font-semibold">ลบ</button>
                                                <button onClick={() => handleLoadCaseFromHistory(item, 'checklist')} className="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-semibold">ดูข้อมูล</button>
                                            </td>
                                        </tr>
                                    ))
                                ) : (
                                    <tr><td colSpan="5" className="text-center py-8 text-gray-400 italic">ไม่มีประวัติ</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen relative pb-10">
                    <header className="bg-[#0f172a] text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-white p-1 rounded-full shrink-0">
                                    <img src="https://i.ibb.co/QFc4HfnW/AI.png" className="h-10 w-10 md:h-12 md:w-12 object-contain" />
                                </div>
                                <div className="text-center md:text-left">
                                    <h1 className="text-lg md:text-xl font-bold text-[#facc15]">ระบบบริหารงานสืบสวนคดีอาญา</h1>
                                    <p className="text-xs md:text-sm text-gray-300">กก.1 บก.ปพ. | ผู้ใช้งาน: {user.email}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onLogout} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-colors flex items-center gap-2 border border-red-500">
                                    🚪 ออกจากระบบ
                                </button>
                            </div>
                        </div>
                    </header>

                    {isSharedView && (
                        <div className="bg-blue-100 border-b border-blue-200 text-blue-800 px-4 py-2 text-center text-xs md:text-sm font-semibold shadow-sm">
                            👁️ ขณะนี้คุณกำลังดูข้อมูลในโหมดผู้เยี่ยมชม (สามารถแก้ไขและแชร์ร่วมกันได้)
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-2 md:px-6 py-4 md:py-6">
                        <div className="flex border-b border-gray-200 mb-4 bg-white rounded-t-xl px-2 pt-2 shadow-sm overflow-x-auto hide-scrollbar snap-x">
                            <button onClick={() => setActiveTab('checklist')} className={`px-4 py-3 text-sm md:text-base whitespace-nowrap snap-start shrink-0 rounded-t-lg ${activeTab === 'checklist' ? 'tab-active' : 'tab-inactive'}`}>📝 Checklist</button>
                            <button onClick={() => setActiveTab('mindmap')} className={`px-4 py-3 text-sm md:text-base whitespace-nowrap snap-start shrink-0 rounded-t-lg ${activeTab === 'mindmap' ? 'tab-active' : 'tab-inactive'}`}>🕸️ Mind Map</button>
                            <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-3 text-sm md:text-base whitespace-nowrap snap-start shrink-0 rounded-t-lg ${activeTab === 'dashboard' ? 'tab-active' : 'tab-inactive'}`}>📊 Dashboard</button>
                            <button onClick={() => setActiveTab('search')} className={`px-4 py-3 text-sm md:text-base whitespace-nowrap snap-start shrink-0 rounded-t-lg ${activeTab === 'search' ? 'tab-active' : 'tab-inactive'}`}>🔍 ค้นหา</button>
                            <button onClick={() => setActiveTab('history')} className={`px-4 py-3 text-sm md:text-base whitespace-nowrap snap-start shrink-0 rounded-t-lg ${activeTab === 'history' ? 'tab-active' : 'tab-inactive'}`}>🕒 ประวัติ</button>
                        </div>

                        <div>
                            {activeTab === 'checklist' && renderChecklist()}
                            {activeTab === 'mindmap' && renderMindMap()}
                            {activeTab === 'dashboard' && renderDashboard()}
                            {activeTab === 'search' && renderSearch()}
                            {activeTab === 'history' && renderHistory()}
                        </div>
                    </main>

                    {/* Modals */}
                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-sm md:max-w-md w-full p-6 text-center md:text-left">
                                <h3 className="text-lg md:text-xl font-bold mb-2 text-gray-800">{modalConfig.title}</h3>
                                <p className="text-sm md:text-base text-gray-600 whitespace-pre-line mb-6">{modalConfig.message}</p>
                                <button onClick={closeModal} className="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-bold transition-colors">ตกลง</button>
                            </div>
                        </div>
                    )}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-sm md:max-w-md w-full p-6 text-center md:text-left border-t-4 border-yellow-500">
                                <h3 className="text-lg md:text-xl font-bold mb-2 text-gray-800">{confirmModal.title}</h3>
                                <p className="text-sm md:text-base text-gray-600 whitespace-pre-line mb-6">{confirmModal.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={closeConfirm} className="flex-1 md:flex-none bg-gray-200 text-gray-800 px-4 py-2.5 rounded-lg font-bold">ยกเลิก</button>
                                    <button onClick={confirmModal.onConfirm} className="flex-1 md:flex-none bg-red-600 text-white px-4 py-2.5 rounded-lg font-bold">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function LoginScreen() {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [isRegistering, setIsRegistering] = React.useState(false);
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError(''); setLoading(true);
                try {
                    const fb = await window.initFirebase();
                    if (!fb) throw new Error("ไม่สามารถเชื่อมต่อ Firebase ได้");
                    if (isRegistering) {
                        await fb.createUserWithEmailAndPassword(fb.auth, email, password);
                    } else {
                        await fb.signInWithEmailAndPassword(fb.auth, email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                        <div className="bg-[#0f172a] px-6 py-7 text-center">
                            <div className="mx-auto mb-4 bg-white p-2 rounded-full w-20 h-20 flex items-center justify-center shadow-lg">
                                <img src="https://i.ibb.co/QFc4HfnW/AI.png" alt="Logo" className="h-16 w-16 object-contain" />
                            </div>
                            <h1 className="text-xl font-bold text-[#facc15]">ระบบบริหารงานสืบสวนคดีอาญา</h1>
                            <p className="text-sm text-slate-300 mt-1">พื้นที่ปฏิบัติงานส่วนบุคคล (Private Workspace)</p>
                        </div>
                        
                        <div className="flex border-b">
                            <button onClick={() => { setIsRegistering(false); setError(''); }} className={`flex-1 py-3 text-sm font-bold ${!isRegistering ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'}`}>เข้าสู่ระบบ</button>
                            <button onClick={() => { setIsRegistering(true); setError(''); }} className={`flex-1 py-3 text-sm font-bold ${isRegistering ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'}`}>ลงทะเบียนผู้ใช้ใหม่</button>
                        </div>

                        <form onSubmit={handleAuth} className="p-6 sm:p-8">
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">อีเมล (Email)</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full border border-slate-300 rounded-lg px-4 py-3" />
                            </div>
                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">รหัสผ่าน (Password)</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} className="w-full border border-slate-300 rounded-lg px-4 py-3" />
                            </div>
                            {error && <div className="mb-4 bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm">⚠️ {error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg">
                                {loading ? 'กำลังประมวลผล...' : (isRegistering ? '📝 สมัครสมาชิก' : '🔐 เข้าสู่ระบบ')}
                            </button>
                            <p className="text-center text-xs text-gray-400 mt-6">ข้อมูลจะถูกจัดเก็บแบบส่วนตัวเข้ารหัส ไม่เปิดเผยต่อผู้ใช้อื่น</p>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [isInitializing, setIsInitializing] = React.useState(true);

            React.useEffect(() => {
                let unsubscribe;
                const setupAuth = async () => {
                    const fb = await window.initFirebase();
                    if (fb && fb.auth) {
                        unsubscribe = fb.onAuthStateChanged(fb.auth, (currentUser) => {
                            setUser(currentUser);
                            setIsInitializing(false);
                        });
                    } else {
                        setIsInitializing(false);
                    }
                };
                setupAuth();
                return () => { if (unsubscribe) unsubscribe(); };
            }, []);

            const handleLogout = async () => {
                const fb = await window.initFirebase();
                if (fb) await fb.signOut(fb.auth);
            };

            if (isInitializing) return <div style={{fontFamily:'Sarabun', padding:'40px', textAlign:'center', color:'#475569'}}>กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...</div>;
            if (!user) return <LoginScreen />;
            return <ChecklistApp user={user} onLogout={handleLogout} />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
