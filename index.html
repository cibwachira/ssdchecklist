    <script>
        window.CASE_STORAGE_KEY = 'ssd_investigation_cases_v2';

        window.getLocalCases = function() {
            try {
                const raw = localStorage.getItem(window.CASE_STORAGE_KEY);
                const data = raw ? JSON.parse(raw) : [];
                return Array.isArray(data) ? data : [];
            } catch (e) {
                console.error('Local storage read error:', e);
                return [];
            }
        };

        window.saveLocalCase = function(caseData, caseId) {
            const list = window.getLocalCases();
            const id = caseId || ('local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
            const now = Date.now();
            const index = list.findIndex(item => item.id === id);
            const existing = index >= 0 ? list[index] : {};
            const saved = {
                ...existing,
                ...caseData,
                id,
                createdAt: existing.createdAt || caseData.createdAt || now,
                updatedAt: now,
                storage: 'local'
            };
            if (index >= 0) list[index] = saved;
            else list.unshift(saved);
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(list));
            return saved;
        };

        window.deleteLocalCase = function(caseId) {
            const list = window.getLocalCases().filter(item => item.id !== caseId);
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(list));
        };
    </script>

            const handleSmartExtract = () => {
                if (!extractRawText.trim()) {
                    showModal('แจ้งเตือน', 'กรุณาวางข้อความที่ต้องการให้ระบบแยกข้อมูลในกล่องข้อความก่อนครับ');
                    return;
                }

                const newFormData = { ...formData };
                let extractedCount = 0;
                const details = []; // ไว้เก็บรายละเอียดว่าเจออะไรบ้าง

                // ฟังก์ชันช่วยเพิ่มข้อมูลแบบไม่ซ้ำ
                const addUnique = (fieldId, matchArray, labelName) => {
                    if (!matchArray || matchArray.length === 0) return;
                    const currentList = newFormData[fieldId] || [];
                    const filteredCurrent = currentList.filter(v => v.trim() !== '');
                    const uniqueMatches = matchArray.map(m => m.trim()).filter(m => !filteredCurrent.includes(m));

                    if (uniqueMatches.length > 0) {
                        newFormData[fieldId] = [...filteredCurrent, ...uniqueMatches];
                        extractedCount += uniqueMatches.length;
                        details.push(`- ${labelName}: ${uniqueMatches.length} รายการ`);
                    }
                };

                // 1. บัตรประชาชน (13 หลักติดกัน หรือมีขีด) -> 1_3
                const idCardRegex = /\b\d{13}\b|\b\d-\d{4}-\d{5}-\d{2}-\d\b/g;
                addUnique('1_3', extractRawText.match(idCardRegex), 'เลขบัตรประชาชน');

                // 2. เบอร์โทรศัพท์มือถือไทย (06, 08, 09 ตามด้วยตัวเลข มีหรือไม่มีขีด) -> 9_3
                const phoneRegex = /\b0[689]\d{1}-?\d{3}-?\d{4}\b/g;
                addUnique('9_3', extractRawText.match(phoneRegex), 'เบอร์โทรศัพท์');

                // 3. ชื่อ-สกุล (กรองจากคำนำหน้า) -> 1_1
                const nameRegex = /(?:นาย|นาง|นางสาว|ด\.ช\.|ด\.ญ\.|พล\.ต\.ต\.|พ\.ต\.อ\.|พ\.ต\.ท\.|พ\.ต\.ต\.|ร\.ต\.อ\.|ร\.ต\.ท\.|ร\.ต\.ต\.|ด\.ต\.|จ\.ส\.ต\.|ส\.ต\.อ\.|ส\.ต\.ท\.|ส\.ต\.ต\.)\s*[ก-๙]+\s+[ก-๙]+/g;
                addUnique('1_1', extractRawText.match(nameRegex), 'ชื่อ-นามสกุล');

                // 4. ทะเบียนรถ (แบบมีตัวเลขนำหน้าตัวอักษร 1กข 1234 หรือไม่มี กค 1234 และจังหวัด) -> 6_1
                const plateRegex = /\b(?:\d?[ก-ฮ]{1,2})\s*\d{1,4}\s*(?:กรุงเทพมหานคร|กทม\.?|[ก-๙]+)?\b/g;
                // ปรับ Regex ให้รัดกุมขึ้นนิดหน่อย เพื่อไม่ให้จับคำไทยมั่ว
                const betterPlateRegex = /(?:\d?[ก-ฮ]{1,2})\s?\d{1,4}\s?(?:กรุงเทพมหานคร|กทม|[ก-๙]{3,})/g;
                addUnique('6_1', extractRawText.match(betterPlateRegex), 'ทะเบียนรถ');

                // 5. เลขบัญชีธนาคาร (ทั่วไป 10 หลักติดกัน หรือมีขีด) -> 11_2 (ข้อมูลฝาก/ถอน/โอน)
                const bankRegex = /\b\d{3}-\d{1}-\d{5}-\d{1}\b|\b\d{10}\b/g;
                addUnique('11_2', extractRawText.match(bankRegex), 'เลขบัญชีธนาคาร');

                if (extractedCount > 0) {
                    setFormData(newFormData);
                    setExtractRawText(''); // ล้างกล่องข้อความ
                    showModal(
                        'แยกข้อมูลสำเร็จ! ✨', 
                        `ระบบดึงข้อมูลและจัดหมวดหมู่ให้อัตโนมัติ จำนวนทั้งหมด ${extractedCount} รายการ:\n\n` + 
                        details.join('\n') + 
                        '\n\nคุณสามารถตรวจสอบได้ในช่องกรอกข้อมูลด้านล่าง หรือดูใน Mind Map ได้ทันที'
                    );
                } else {
                    showModal('ผลการสกัดข้อมูล', 'ระบบไม่พบรูปแบบข้อมูล (บัตร ปชช., เบอร์โทร, ชื่อ, ทะเบียนรถ, บัญชี) ที่ตรงกับเงื่อนไขในข้อความนี้ครับ');
                }
            };

            const handleSearchDatabase = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) {
                    showModal('แจ้งเตือน', 'กรุณากรอกชื่อ เลขคดี ผู้รับผิดชอบ หรือเลขบัตรประชาชนสำหรับค้นหา');
                    return;
                }
                setIsSearching(true);
                try {
                    let source = window.getLocalCases();
                    const fb = await window.initFirebase();
                    if (fb) {
                        const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                        const snapshot = await fb.getDocs(casesRef);
                        source = [];
                        snapshot.forEach(docSnap => source.push({ id: docSnap.id, ...docSnap.data(), storage: 'firebase' }));
                    }

                    const queryStr = searchQuery.toLowerCase().trim();
                    const results = source.filter(data => {
                        const tName = (data.targetName || '').toLowerCase();
                        const cNum = (data.caseNumber || '').toLowerCase();
                        const oName = (data.officerName || '').toLowerCase();
                        const idCard = ((data.formData && data.formData['1_3']) || []).join(' ').toLowerCase();
                        return tName.includes(queryStr) || cNum.includes(queryStr) || oName.includes(queryStr) || idCard.includes(queryStr);
                    });

                    setSearchResults(results);
                    if (results.length === 0) showModal('ไม่พบผลการค้นหา', `ไม่พบประวัติเป้าหมายที่ตรงกับ "${searchQuery}"`);
                } catch (error) {
                    showModal('เกิดข้อผิดพลาด', 'ไม่สามารถค้นหาข้อมูลได้: ' + error.message);
                }
                setIsSearching(false);
            };

            const handleLoadCaseFromHistory = (caseData, tab = 'checklist') => {
                setCurrentCaseId(caseData.id || null);
                setTargetName(caseData.targetName || '');
                setCaseNumber(caseData.caseNumber || '');
                setOfficerName(caseData.officerName || '');
                setFormData(caseData.formData || {});
                if (caseData.categories) setCategories(caseData.categories);
                setActiveTab(tab);
                showModal('โหลดข้อมูลสำเร็จ', `ดึงข้อมูลของ "${caseData.targetName || 'ไม่ระบุชื่อ'}" มาแสดงเรียบร้อยแล้ว`);
            };

            const requestEditCase = (caseData) => {
                showConfirm('ยืนยันการแก้ไขข้อมูล', `คุณต้องการโหลดและแก้ไขข้อมูลของ "${caseData.targetName || 'ไม่ระบุชื่อ'}" ใช่หรือไม่?`, () => {
                    handleLoadCaseFromHistory(caseData);
                    closeConfirm();
                });
            };

            const requestDeleteCase = (caseId, targetNameLabel) => {
                showConfirm('⚠️ ยืนยันการลบข้อมูล', `คุณต้องการลบประวัติของ "${targetNameLabel || 'ไม่ระบุชื่อ'}" ออกจากระบบถาวร ใช่หรือไม่?`, async () => {
                    closeConfirm();
                    try {
                        window.deleteLocalCase(caseId);
                        const fb = await window.initFirebase();
                        if (fb && !String(caseId).startsWith('local_')) {
                            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', caseId);
                            await fb.deleteDoc(docRef);
                        }
                        setAllCasesHistory(prev => prev.filter(item => item.id !== caseId));
                        setSearchResults(prev => prev.filter(item => item.id !== caseId));
                        if (currentCaseId === caseId) setCurrentCaseId(null);
                        showModal('ลบข้อมูลสำเร็จ', 'ลบประวัติเป้าหมายออกจากระบบเรียบร้อยแล้ว');
                    } catch (error) {
                        showModal('เกิดข้อผิดพลาด', 'ไม่สามารถลบข้อมูลได้: ' + error.message);
                    }
                });
            };

            const handleShareOnline = async () => {
                setIsSharing(true);
                try {
                    const fb = await window.initFirebase();
                    if (!fb) {
                        showModal('ขัดข้อง', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
                        setIsSharing(false);
                        return;
                    }
                    const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                    const payload = { targetName, caseNumber, officerName, formData, categories, updatedAt: Date.now() };
                    let targetDocRef;

                    if (currentCaseId && !String(currentCaseId).startsWith('local_')) {
                        targetDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', currentCaseId);
                        await fb.setDoc(targetDocRef, payload, { merge: true });
                    } else {
                        payload.createdAt = Date.now();
                        targetDocRef = await fb.addDoc(casesRef, payload);
                        setCurrentCaseId(targetDocRef.id);
                    }

                    const shareUrl = `${window.location.origin}${window.location.pathname}?caseId=${targetDocRef.id}`;
                    try { await navigator.clipboard.writeText(shareUrl); } catch (_) {
                        const textArea = document.createElement('textarea');
                        textArea.value = shareUrl;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        textArea.remove();
                    }
                    await fetchAllHistory();
                    showModal('แชร์ข้อมูลออนไลน์สำเร็จ!', `คัดลอกลิงก์สำหรับแชร์แล้ว\n\n${shareUrl}`);
                } catch (error) {
                    showModal('เกิดข้อผิดพลาด', `ไม่สามารถแชร์ได้: ${error.message}`);
                } finally {
                    setIsSharing(false);
                }
            };

            const handleSave = async () => {
                if (!targetName.trim() && !caseNumber.trim()) {
                    showModal('กรุณาระบุข้อมูล', 'กรุณากรอกอย่างน้อย "ชื่อ-สกุล เป้าหมาย" หรือ "เลขคดี / หมายจับ" ก่อนบันทึก');
                    return;
                }
                setIsSaving(true);
                try {
                    const now = Date.now();
                    const localId = currentCaseId || ('local_' + now + '_' + Math.random().toString(36).slice(2, 8));
                    const payload = { targetName: targetName.trim(), caseNumber: caseNumber.trim(), officerName: officerName.trim(), formData, categories, updatedAt: now };

                    const localSaved = window.saveLocalCase(payload, localId);
                    setCurrentCaseId(currentCaseId || localSaved.id);

                    const fb = await window.initFirebase();
                    let onlineSaved = false;
                    if (fb) {
                        const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                        if (currentCaseId && !String(currentCaseId).startsWith('local_')) {
                            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', currentCaseId);
                            await fb.setDoc(docRef, payload, { merge: true });
                            onlineSaved = true;
                        } else {
                            const docRef = await fb.addDoc(casesRef, { ...payload, createdAt: now });
                            setCurrentCaseId(docRef.id);
                            onlineSaved = true;
                        }
                    }

                    if (onlineSaved) {
                        await fetchAllHistory();
                    } else {
                        setAllCasesHistory(prev => {
                            const exists = prev.some(item => item.id === localSaved.id);
                            const next = exists ? prev.map(item => item.id === localSaved.id ? localSaved : item) : [localSaved, ...prev];
                            return next.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                        });
                    }

                    setIsSaving(false);
                    showModal('บันทึกสำเร็จ', onlineSaved ? 'บันทึกข้อมูลออนไลน์แล้ว' : 'บันทึกข้อมูลในเครื่องแล้ว');
                } catch (error) {
                    setIsSaving(false);
                    showModal('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message);
                }
            };

            const exportMindMapPDF = async () => {
                const element = document.getElementById('mindmap-export-container');
                const graphContainer = document.getElementById('network-container');
                if (!element || !graphContainer) return showModal('แจ้งเตือน', 'ไม่พบพื้นที่ Mind Map');
                
                const filledCount = Object.values(formData || {}).flat().filter(v => v !== null && String(v).trim() !== '').length;
                if (filledCount === 0) return showModal('แจ้งเตือน', 'ยังไม่มีข้อมูล กรุณากรอกข้อมูลก่อนส่งออก');

                try {
                    if (window.currentMindMapNetwork) {
                        window.currentMindMapNetwork.fit({ animation: false });
                        window.currentMindMapNetwork.redraw();
                    }
                    await new Promise(resolve => setTimeout(resolve, 700));

                    const canvas = graphContainer.querySelector('canvas');
                    const exportScale = 2;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width * exportScale;
                    tempCanvas.height = canvas.height * exportScale;
                    const ctx = tempCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);

                    const imgData = tempCanvas.toDataURL('image/jpeg', 0.98);
                    const pdfWrapper = document.createElement('div');
                    pdfWrapper.id = 'mindmap-pdf-temp-wrapper';
                    pdfWrapper.style.cssText = 'background:#ffffff;width:100%;padding:12px;box-sizing:border-box;font-family:Sarabun,sans-serif';

                    const title = document.createElement('div');
                    title.style.cssText = 'text-align:center;margin-bottom:10px';
                    title.innerHTML = `<h2 style="margin:0 0 6px 0;font-size:22px;font-weight:700;color:#111827">ผังความเชื่อมโยง (Mind Map) - ${targetName || 'ไม่ระบุเป้าหมาย'}</h2>
                                       <div style="font-size:13px;color:#4b5563">เลขคดี: ${caseNumber || '-'}  |  ผู้รับผิดชอบ: ${officerName || '-'}  |  จำนวนข้อมูล: ${filledCount} รายการ</div>`;

                    const img = document.createElement('img');
                    img.src = imgData;
                    img.style.cssText = 'display:block;width:100%;height:auto;border:1px solid #d1d5db;box-sizing:border-box';

                    pdfWrapper.appendChild(title);
                    pdfWrapper.appendChild(img);
                    document.body.appendChild(pdfWrapper);

                    const opt = {
                        margin: 6,
                        filename: `MindMap_${(targetName || 'Target').replace(/[\\/:*?"<>|]/g, '_')}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true }
                    };
                    await html2pdf().set(opt).from(pdfWrapper).save();
                    pdfWrapper.remove();
                    showModal('ส่งออก PDF สำเร็จ', `สร้างไฟล์ Mind Map เรียบร้อยแล้ว\nข้อมูลทั้งหมด: ${filledCount} รายการ`);
                } catch (err) {
                    const temp = document.getElementById('mindmap-pdf-temp-wrapper');
                    if (temp) temp.remove();
                    showModal('ข้อผิดพลาด', 'ไม่สามารถสร้างไฟล์ PDF ได้: ' + (err.message || err));
                }
            };

            const exportDashboardPDF = () => {
                const element = document.getElementById('dashboard-export-container');
                const opt = {
                    margin: 10, filename: `Dashboard_${targetName || 'Target'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            React.useEffect(() => {
                if (activeTab === 'mindmap') {
                    const container = document.getElementById('network-container');
                    if (!container) return;

                    let nodesArray = [
                        { id: 'center', label: targetName || 'เป้าหมาย\n(ไม่ระบุชื่อ)', shape: 'dot', size: 25, color: { background: '#ef4444', border: '#b91c1c' }, font: { color: '#ffffff', size: 16, bold: true }, shadow: true }
                    ];
                    let edgesArray = [];

                    categories.forEach(cat => {
                        let hasData = false;
                        cat.fields.forEach(field => {
                            const values = (formData[field.id] || []).filter(val => val && String(val).trim() !== '');
                            if (values.length > 0) {
                                hasData = true;
                                values.forEach((val, idx) => {
                                    const nodeId = `val_${field.id}_${idx}`;
                                    nodesArray.push({
                                        id: nodeId, label: `${field.label}:\n${val}`, shape: 'box',
                                        color: { background: '#eff6ff', border: '#bfdbfe' }, font: { size: 12 }
                                    });
                                    edgesArray.push({ from: cat.id, to: nodeId, color: { color: '#94a3b8' } });
                                });
                            }
                        });

                        if (hasData) {
                            nodesArray.push({ id: cat.id, label: cat.title, shape: 'box', color: { background: '#fef08a', border: '#facc15' }, font: { bold: true } });
                            edgesArray.push({ from: 'center', to: cat.id, width: 2, color: { color: '#64748b' } });
                        }
                    });

                    const data = { nodes: new vis.DataSet(nodesArray), edges: new vis.DataSet(edgesArray) };
                    const options = { layout: { improvedLayout: true }, physics: { stabilization: false, barnesHut: { springLength: 150 } } };
                    window.currentMindMapNetwork = new vis.Network(container, data, options);
                }

            const renderChecklist = () => (
                <div className="space-y-6">
                    {/* ฟีเจอร์ใหม่: ผู้ช่วยแยกข้อมูลอัตโนมัติ */}

                        <div className="flex items-center gap-3 mb-3">
                            <div className="bg-purple-600 text-white p-2 rounded-lg shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                </svg>
                            </div>
                            <div>
                                <h3 className="text-lg font-bold text-purple-900">ผู้ช่วยแยกข้อมูลอัตโนมัติ (Smart Extract)</h3>
                                <p className="text-sm text-purple-700">วางข้อความยาวๆ เช่น รายงาน หรือข้อความแชท ระบบจะดึง บัตร ปชช., ชื่อ, เบอร์โทร, ทะเบียนรถ, เลขบัญชี ไปใส่ให้ในหมวดหมู่ต่างๆ ทันที</p>
                            </div>
                        </div>
                        <textarea
                            value={extractRawText}
                            onChange={(e) => setExtractRawText(e.target.value)}
                            placeholder="วางข้อความที่นี่... (เช่น 'นาย สมชาย จับกุมได้พร้อมรถ 1กข 1234 กทม เบอร์โทร 0891234567')"
                            className="w-full h-32 p-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 resize-y mb-3 text-sm"
                        ></textarea>
                        <div className="flex justify-end">
                            <button

                                className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-colors flex items-center gap-2"
                            >
                                ✨ แยกข้อมูลและจัดหมวดหมู่
                            </button>

                    {/* กล่องข้อมูลหลักเป้าหมาย */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">ชื่อ-สกุล เป้าหมาย</label>
                                <input type="text" value={targetName} onChange={e => setTargetName(e.target.value)} placeholder="ระบุชื่อผู้ต้องหา" className="w-full border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 p-2 disabled:bg-gray-100" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-1">เลขคดี / หมายจับ</label>
                                <input type="text" value={caseNumber} onChange={e => setCaseNumber(e.target.value)} placeholder="ระบุเลขคดี" className="w-full border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 p-2 disabled:bg-gray-100" />
                            </div>
                            <div>

                                <img src="https://upload.wikimedia.org/wikipedia/th/thumb/a/a2/Crime_Suppression_Division_th_logo.png/180px-Crime_Suppression_Division_th_logo.png" alt="Logo" className="h-16 w-16 object-contain" />
                            </div>
                            <h1 className="text-xl font-bold text-[#facc15]">ระบบบริหารงานสืบสวนคดีอาญา</h1>
                            <p className="text-sm text-slate-300 mt-1">กองกำกับการ 1 กองบังคับการปฏิบัติการพิเศษ</p>
                        </div>
                        <form onSubmit={handleLogin} className="p-6 sm:p-8">
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="กรอก Username" className="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" required />
                            </div>
                            <div className="mb-4 relative">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                                <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="กรอก Password" className="w-full border border-slate-300 rounded-lg px-4 py-3 pr-16 outline-none focus:ring-2 focus:ring-blue-500" required />
                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-2 top-9 text-xs font-semibold text-slate-500 hover:text-slate-800 px-2 py-1">
                                    {showPassword ? 'ซ่อน' : 'แสดง'}
                                </button>
                            </div>
                            {error && <div className="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm font-semibold">⚠️ {error}</div>}
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-lg">🔐 เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [loggedIn, setLoggedIn] = React.useState(() => sessionStorage.getItem('cibssd_logged_in') === 'true');
            if (!loggedIn) return <LoginScreen onLogin={() => setLoggedIn(true)} />;
            return <ChecklistApp />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
