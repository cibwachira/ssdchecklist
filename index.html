            getFirestore, doc, getDoc, addDoc, setDoc, deleteDoc,
            collection, getDocs

        // Firebase configuration ของโปรเจกต์จริง
        const firebaseConfig = {
            apiKey: "AIzaSyBtj-K0o4wgJWrlK1NY-wqpUdzatqzXEnw",
            authDomain: "investigation-b8b3a.firebaseapp.com",
            projectId: "investigation-b8b3a",
            storageBucket: "investigation-b8b3a.firebasestorage.app",
            messagingSenderId: "913418532683",
            appId: "1:913418532683:web:058ae422ef17f023509ace",
            measurementId: "G-E5FXKET5GS"
        };

        window.initFirebase = async () => {
            try {
                const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                // ผู้ใช้ทุกคนที่เปิดเว็บจะเข้าสู่ระบบแบบ Anonymous
                // ทำให้ Firestore Rules สามารถตรวจสอบ request.auth ได้
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }

                return {
                    db, auth,
                    appId: "investigation-b8b3a",
                    collection, addDoc, setDoc, getDoc, getDocs, deleteDoc, doc
                };
            } catch (error) {
                console.error("Firebase init error:", error);
                throw error;
            }
        };

        window.firebaseReady = window.initFirebase();
    </script>

    <script>
        // ================================================================
        // Local Storage: ใช้เป็นฐานข้อมูลสำรอง เพื่อให้ระบบใช้งานได้จริง
        // แม้เปิดไฟล์ HTML โดยตรง หรือยังไม่ได้ตั้งค่า Firebase
        // ================================================================
        window.CASE_STORAGE_KEY = 'ssd_investigation_cases_v2';

        window.getLocalCases = function() {
            try {
                const raw = localStorage.getItem(window.CASE_STORAGE_KEY);
                const data = raw ? JSON.parse(raw) : [];
                return Array.isArray(data) ? data : [];
            } catch (e) {
                console.error('Local storage read error:', e);
                return [];
            }
        };

        window.saveLocalCase = function(caseData, caseId) {
            const list = window.getLocalCases();
            const id = caseId || ('local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
            const now = Date.now();
            const index = list.findIndex(item => item.id === id);
            const existing = index >= 0 ? list[index] : {};
            const saved = {
                ...existing,
                ...caseData,
                id,
                createdAt: existing.createdAt || caseData.createdAt || now,
                updatedAt: now,
                storage: 'local'
            };
            if (index >= 0) list[index] = saved;
            else list.unshift(saved);
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(list));
            return saved;
        };

        window.deleteLocalCase = function(caseId) {
            const list = window.getLocalCases().filter(item => item.id !== caseId);
            localStorage.setItem(window.CASE_STORAGE_KEY, JSON.stringify(list));
        };

        window.hasFirebaseConfig = function() {
            return typeof __firebase_config !== 'undefined' && !!__firebase_config;
        };
    </script>

        function ChecklistApp() {
            const [activeTab, setActiveTab] = React.useState('checklist');
            const [currentCaseId, setCurrentCaseId] = React.useState(null); // เพิ่ม State เก็บ ID เคสปัจจุบันที่กำลังแก้ไข
            const [targetName, setTargetName] = React.useState('');
            const [caseNumber, setCaseNumber] = React.useState('');
            const [officerName, setOfficerName] = React.useState('');
            const [formData, setFormData] = React.useState({});
            const [categories, setCategories] = React.useState(initialCategories);
            const [customFieldInputs, setCustomFieldInputs] = React.useState({});
            const [isSaving, setIsSaving] = React.useState(false);
            
            // State สำหรับระบบค้นหาประวัติ
            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [isSearching, setIsSearching] = React.useState(false);
            
            // State สำหรับประวัติ Checklist ทั้งหมดในระบบ
            const [allCasesHistory, setAllCasesHistory] = React.useState([]);
            
            // State สำหรับระบบแชร์
            const [isSharedView, setIsSharedView] = React.useState(false);
            const [isSharing, setIsSharing] = React.useState(false);
            
            // State สำหรับ Modal ทั่วไป
            const [modalConfig, setModalConfig] = React.useState({ isOpen: false, title: '', message: '' });

            // State สำหรับ Confirmation Modal (ยืนยันก่อนลบ/แก้ไข)
            const [confirmModal, setConfirmModal] = React.useState({ 
                isOpen: false, 
                title: '', 
                message: '', 
                onConfirm: null 
            });

            const fetchAllHistory = async () => {
                try {
                    // แสดงข้อมูลที่บันทึกในเครื่องก่อนทันที
                    const localList = window.getLocalCases().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                    setAllCasesHistory(localList);

                    // ถ้ามี Firebase ให้โหลดข้อมูลออนไลน์และใช้เป็นแหล่งข้อมูลหลัก
                    const fb = await window.initFirebase();
                    if (!fb) return;
                    const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                    const snapshot = await fb.getDocs(casesRef);
                    const remoteList = [];
                    snapshot.forEach(docSnap => {
                        remoteList.push({ id: docSnap.id, ...docSnap.data(), storage: 'firebase' });
                    });
                    remoteList.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
                    setAllCasesHistory(remoteList);
                } catch (e) {
                    console.error('Error fetching history:', e);
                    setAllCasesHistory(window.getLocalCases());
                }
            };

            React.useEffect(() => {
                const loadSharedData = async () => {
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        const sharedCaseId = urlParams.get('caseId');

                        if (sharedCaseId) {
                            try {
                                const fb = await window.initFirebase();

                                if (!fb) {
                                    showModal('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
                                    return;
                                }

                                const docRef = fb.doc(
                                    fb.db,
                                    'artifacts',
                                    fb.appId,
                                    'public',
                                    'data',
                                    'cases',
                                    sharedCaseId
                                );

                                const docSnap = await fb.getDoc(docRef);

                                if (docSnap.exists()) {
                                    const data = docSnap.data();

                                    setCurrentCaseId(sharedCaseId);
                                    setTargetName(data.targetName || '');
                                    setCaseNumber(data.caseNumber || '');
                                    setOfficerName(data.officerName || '');
                                    setFormData(data.formData || {});

                                    if (data.categories) {
                                        setCategories(data.categories);
                                    }

                                    setIsSharedView(true);
                                    setActiveTab('mindmap');

                                    showModal(
                                        'โหลดข้อมูลสำเร็จ',
                                        'เปิดข้อมูลร่วมกันแล้ว — ผู้ใช้งานที่ได้รับลิงก์สามารถแก้ไขและบันทึกข้อมูลได้'
                                    );
                                } else {
                                    showModal(
                                        'ไม่พบข้อมูล',
                                        'ลิงก์แชร์นี้อาจหมดอายุหรือไม่พบในระบบ'
                                    );
                                }
                            } catch (error) {
                                console.error('Error loading shared data:', error);
                                showModal(
                                    'เกิดข้อผิดพลาด',
                                    'ไม่สามารถโหลดข้อมูลที่แชร์ได้: ' + (error.message || error)
                                );
                            }
                        } else {
                            // ไม่มี caseId = เปิดหน้าเว็บปกติ
                            await fetchAllHistory();
                        }
                    } catch (error) {
                        // สำคัญ: ต่อให้ Firebase มีปัญหา หน้าเว็บหลักก็ต้องแสดง
                        console.error('Initial load error:', error);
                        setIsSharedView(false);

                        try {
                            await fetchAllHistory();
                        } catch (historyError) {
                            console.error('History fallback error:', historyError);
                        }
                    }
                };

                loadSharedData();
            }, []);

            const showModal = (title, message) => {
                setModalConfig({ isOpen: true, title, message });
            };

            const closeModal = () => {
                setModalConfig({ isOpen: false, title: '', message: '' });
            };

            const showConfirm = (title, message, onConfirm) => {
                setConfirmModal({ isOpen: true, title, message, onConfirm });
            };

            const closeConfirm = () => {
                setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
            };

            const handleAddValue = (fieldId) => {
                const currentValues = formData[fieldId] || [''];
                setFormData({ ...formData, [fieldId]: [...currentValues, ''] });
            };

            const handleRemoveValue = (fieldId, indexToRemove) => {
                const currentValues = formData[fieldId] || [];
                const newValues = currentValues.filter((_, idx) => idx !== indexToRemove);
                setFormData({ ...formData, [fieldId]: newValues });
            };

            const handleChangeValue = (fieldId, index, newValue) => {
                const currentValues = formData[fieldId] || [''];
                const updatedValues = [...currentValues];
                updatedValues[index] = newValue;
                setFormData({ ...formData, [fieldId]: updatedValues });
            };

            const handleCustomFieldInputChange = (catId, value) => {
                setCustomFieldInputs({ ...customFieldInputs, [catId]: value });
            };

            const handleAddCustomField = (catId) => {
                const newLabel = customFieldInputs[catId];
                if (!newLabel || newLabel.trim() === '') return;

                const newFieldId = `custom_${catId}_${Date.now()}`;
                const updatedCategories = categories.map(cat => {
                    if (cat.id === catId) {
                        return {
                            ...cat,
                            fields: [...cat.fields, { id: newFieldId, label: newLabel.trim() }]
                        };
                    }

            const handleSearchDatabase = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) {
                    showModal('แจ้งเตือน', 'กรุณากรอกชื่อ เลขคดี ผู้รับผิดชอบ หรือเลขบัตรประชาชนสำหรับค้นหา');
                    return;
                }

                setIsSearching(true);
                try {
                    let source = window.getLocalCases();
                    const fb = await window.initFirebase();

                    if (fb) {
                        const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                        const snapshot = await fb.getDocs(casesRef);
                        source = [];
                        snapshot.forEach(docSnap => source.push({ id: docSnap.id, ...docSnap.data(), storage: 'firebase' }));
                    }

                    const queryStr = searchQuery.toLowerCase().trim();
                    const results = source.filter(data => {
                        const tName = (data.targetName || '').toLowerCase();
                        const cNum = (data.caseNumber || '').toLowerCase();
                        const oName = (data.officerName || '').toLowerCase();
                        const idCard = ((data.formData && data.formData['1_3']) || []).join(' ').toLowerCase();
                        return tName.includes(queryStr) || cNum.includes(queryStr) || oName.includes(queryStr) || idCard.includes(queryStr);
                    });

                    setSearchResults(results);
                    if (results.length === 0) {
                        showModal('ไม่พบผลการค้นหา', `ไม่พบประวัติเป้าหมายที่ตรงกับ "${searchQuery}"`);
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    showModal('เกิดข้อผิดพลาด', 'ไม่สามารถค้นหาข้อมูลได้: ' + error.message);
                }
                setIsSearching(false);
            };

            const handleLoadCaseFromHistory = (caseData, tab = 'checklist') => {
                setCurrentCaseId(caseData.id || null);
                setTargetName(caseData.targetName || '');
                setCaseNumber(caseData.caseNumber || '');
                setOfficerName(caseData.officerName || '');
                setFormData(caseData.formData || {});
                if (caseData.categories) setCategories(caseData.categories);
                setActiveTab(tab);
                showModal('โหลดข้อมูลสำเร็จ', `ดึงข้อมูลของ "${caseData.targetName || 'ไม่ระบุชื่อ'}" มาแสดงเรียบร้อยแล้ว`);
            };

            // ฟังก์ชันขอยืนยันก่อนแก้ไขข้อมูลจากประวัติ
            const requestEditCase = (caseData) => {

            const requestDeleteCase = (caseId, targetNameLabel) => {
                showConfirm(
                    '⚠️ ยืนยันการลบข้อมูล',
                    `คุณต้องการลบประวัติของ "${targetNameLabel || 'ไม่ระบุชื่อ'}" ออกจากระบบถาวร ใช่หรือไม่?\nการกระทำนี้ไม่สามารถย้อนกลับได้`,
                    async () => {
                        closeConfirm();
                        try {
                            // ลบจากเครื่องเสมอ
                            window.deleteLocalCase(caseId);

                            // ถ้าเป็นข้อมูล Firebase ให้ลบจากออนไลน์ด้วย
                            const fb = await window.initFirebase();
                            if (fb && !String(caseId).startsWith('local_')) {
                                const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', caseId);
                                await fb.deleteDoc(docRef);
                            }

                            setAllCasesHistory(prev => prev.filter(item => item.id !== caseId));

                            if (currentCaseId === caseId) {
                                setCurrentCaseId(null);
                            }
                            showModal('ลบข้อมูลสำเร็จ', 'ลบประวัติเป้าหมายออกจากระบบเรียบร้อยแล้ว');
                        } catch (error) {
                            console.error('Delete error:', error);
                            showModal('เกิดข้อผิดพลาด', 'ไม่สามารถลบข้อมูลได้: ' + error.message);
                        }
                    }
                );
            };

            const handleShareOnline = async () => {
                setIsSharing(true);
                try {
                    const fb = await window.initFirebase();
                    if (!fb) {
                        showModal('ยังไม่สามารถแชร์ออนไลน์ได้', 'ระบบสามารถบันทึกข้อมูลในเครื่องได้แล้ว แต่การแชร์ออนไลน์ต้องตั้งค่า Firebase ก่อน');
                        setIsSharing(false);
                        return;
                    }

                    const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                    const payload = { targetName, caseNumber, officerName, formData, categories, updatedAt: Date.now() };
                    let targetDocRef;

                    if (currentCaseId && !String(currentCaseId).startsWith('local_')) {
                        targetDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', currentCaseId);
                        await fb.setDoc(targetDocRef, payload, { merge: true });
                    } else {
                        payload.createdAt = Date.now();
                        targetDocRef = await fb.addDoc(casesRef, payload);
                        setCurrentCaseId(targetDocRef.id);
                    }

                    const baseUrl = window.location.origin + window.location.pathname;
                    const shareUrl = `${baseUrl}?caseId=${targetDocRef.id}`;
                    try { await navigator.clipboard.writeText(shareUrl); } catch (_) {
                        const textArea = document.createElement('textarea');
                        textArea.value = shareUrl;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        textArea.remove();
                    }
                    await fetchAllHistory();
                    showModal('แชร์ข้อมูลออนไลน์สำเร็จ!', `คัดลอกลิงก์สำหรับแชร์แล้ว\n\n${shareUrl}`);
                } catch (error) {
                    console.error('Share error:', error);
                    showModal('เกิดข้อผิดพลาด', `ไม่สามารถแชร์ได้: ${error.message}`);
                } finally {
                    setIsSharing(false);
                }
            };

            const handleSave = async () => {

                if (!targetName.trim() && !caseNumber.trim()) {
                    showModal('กรุณาระบุข้อมูล', 'กรุณากรอกอย่างน้อย "ชื่อ-สกุล เป้าหมาย" หรือ "เลขคดี / หมายจับ" ก่อนบันทึก');
                    return;
                }

                setIsSaving(true);
                try {
                    const now = Date.now();
                    const localId = currentCaseId || ('local_' + now + '_' + Math.random().toString(36).slice(2, 8));
                    const payload = {
                        targetName: targetName.trim(),
                        caseNumber: caseNumber.trim(),
                        officerName: officerName.trim(),
                        formData,
                        categories,
                        updatedAt: now
                    };

                    // 1) บันทึกในเครื่องก่อน เพื่อไม่ให้ข้อมูลหายแม้ไม่มี Firebase
                    const localSaved = window.saveLocalCase(payload, localId);
                    setCurrentCaseId(currentCaseId || localSaved.id);

                    // 2) ถ้ามี Firebase ให้บันทึกออนไลน์เพิ่มเติม
                    const fb = await window.initFirebase();
                    let onlineSaved = false;
                    if (fb) {
                        const casesRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases');
                        if (currentCaseId && !String(currentCaseId).startsWith('local_')) {
                            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'cases', currentCaseId);
                            await fb.setDoc(docRef, payload, { merge: true });
                            onlineSaved = true;
                        } else {
                            const docRef = await fb.addDoc(casesRef, { ...payload, createdAt: now });
                            setCurrentCaseId(docRef.id);
                            onlineSaved = true;
                        }
                    }

                    // 3) อัปเดตประวัติบนหน้าจอทันที
                    if (onlineSaved) {
                        await fetchAllHistory();
                    } else {
                        setAllCasesHistory(prev => {
                            const exists = prev.some(item => item.id === localSaved.id);
                            const next = exists ? prev.map(item => item.id === localSaved.id ? localSaved : item) : [localSaved, ...prev];
                            return next.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                        });
                    }

                    setIsSaving(false);
                    showModal('บันทึกสำเร็จ', onlineSaved
                        ? 'บันทึกข้อมูล Checklist ลงฐานข้อมูลออนไลน์แล้ว และข้อมูลจะแสดงในประวัติทันที'
                        : 'บันทึกข้อมูล Checklist ลงในเครื่องแล้ว ข้อมูลจะแสดงในประวัติทันที');
                } catch (error) {
                    console.error('Save error:', error);
                    setIsSaving(false);
                    showModal('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message);
                }
            };

            const exportMindMapPDF = async () => {
                const element = document.getElementById('mindmap-export-container');
                const graphContainer = document.getElementById('network-container');

                if (!element || !graphContainer) {
                    showModal('แจ้งเตือน', 'ไม่พบพื้นที่ Mind Map สำหรับส่งออก');
                    return;

                // ตรวจสอบว่ามีข้อมูลจริงก่อนส่งออก
                const filledCount = Object.values(formData || {})
                    .flat()
                    .filter(v => v !== null && v !== undefined && String(v).trim() !== '').length;

                if (filledCount === 0) {
                    showModal('แจ้งเตือน', 'ยังไม่มีข้อมูลใน Mind Map กรุณากรอกข้อมูลใน Checklist ก่อนส่งออก');
                    return;
                }

                try {
                    // ให้ vis-network จัดตำแหน่ง Node ทั้งหมดให้อยู่ในกรอบก่อนจับภาพ
                    if (window.currentMindMapNetwork) {
                        try {
                            window.currentMindMapNetwork.fit({
                                animation: false
                            });
                            window.currentMindMapNetwork.redraw();
                        } catch (e) {
                            console.warn('Network fit error:', e);
                        }
                    }

                    // รอให้ Canvas วาดข้อมูลล่าสุดเสร็จ
                    await new Promise(resolve => setTimeout(resolve, 700));

                    const canvas = graphContainer.querySelector('canvas');
                    if (!canvas) {
                        showModal('แจ้งเตือน', 'ไม่พบข้อมูลกราฟ กรุณาเปิดหน้า Mind Map อีกครั้ง');
                        return;
                    }

                    // สร้าง Canvas ใหม่เพื่อบังคับพื้นหลังสีขาว
                    // และคงข้อความ/Node ที่ vis-network วาดไว้ทั้งหมด
                    const exportScale = 2;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width * exportScale;
                    tempCanvas.height = canvas.height * exportScale;

                    const ctx = tempCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(
                        canvas,
                        0, 0, canvas.width, canvas.height,
                        0, 0, tempCanvas.width, tempCanvas.height
                    );

                    const imgData = tempCanvas.toDataURL('image/jpeg', 0.98);

                    // สร้างพื้นที่สำหรับ PDF โดยไม่ใช้ Canvas ของ vis-network โดยตรง
                    const pdfWrapper = document.createElement('div');
                    pdfWrapper.id = 'mindmap-pdf-temp-wrapper';
                    pdfWrapper.style.background = '#ffffff';
                    pdfWrapper.style.width = '100%';
                    pdfWrapper.style.padding = '12px';
                    pdfWrapper.style.boxSizing = 'border-box';
                    pdfWrapper.style.fontFamily = 'Sarabun, sans-serif';

                    const title = document.createElement('div');
                    title.style.textAlign = 'center';
                    title.style.marginBottom = '10px';

                    const h = document.createElement('h2');
                    h.textContent = `ผังความเชื่อมโยง (Mind Map) - ${targetName || 'ไม่ระบุเป้าหมาย'}`;
                    h.style.margin = '0 0 6px 0';
                    h.style.fontSize = '22px';
                    h.style.fontWeight = '700';
                    h.style.color = '#111827';

                    const info = document.createElement('div');
                    info.textContent = `เลขคดี: ${caseNumber || '-'}  |  ผู้รับผิดชอบ: ${officerName || '-'}  |  จำนวนข้อมูล: ${filledCount} รายการ`;
                    info.style.fontSize = '13px';
                    info.style.color = '#4b5563';

                    title.appendChild(h);
                    title.appendChild(info);

                    const img = document.createElement('img');
                    img.src = imgData;
                    img.style.display = 'block';
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.border = '1px solid #d1d5db';
                    img.style.boxSizing = 'border-box';

                    pdfWrapper.appendChild(title);
                    pdfWrapper.appendChild(img);

                    document.body.appendChild(pdfWrapper);

                    const safeName = (targetName || 'Target')
                        .replace(/[\\/:*?"<>|]/g, '_')
                        .trim();

                    const opt = {
                        margin: 6,
                        filename: `MindMap_${safeName || 'Target'}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: '#ffffff',
                            logging: false
                        },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                        jsPDF: {
                            unit: 'mm',
                            format: 'a4',
                            orientation: 'landscape',
                            compress: true
                        }
                    };

                    await html2pdf().set(opt).from(pdfWrapper).save();

                    pdfWrapper.remove();

                    showModal(
                        'ส่งออก PDF สำเร็จ',
                        `สร้างไฟล์ Mind Map ของ "${targetName || 'ไม่ระบุเป้าหมาย'}" เรียบร้อยแล้ว\\nข้อมูลที่นำไปแสดงใน Node: ${filledCount} รายการ`
                    );

                } catch (err) {
                    const temp = document.getElementById('mindmap-pdf-temp-wrapper');
                    if (temp) temp.remove();

                    console.error('Mind Map PDF export error:', err);

                                <div className="mx-auto mb-4 bg-white p-2 rounded-full w-20 h-20 flex items-center justify-center shadow-lg">
                                    <img
                                        src="https://upload.wikimedia.org/wikipedia/th/thumb/a/a2/Crime_Suppression_Division_th_logo.png/180px-Crime_Suppression_Division_th_logo.png"
                                        alt="Logo"
                                        className="h-16 w-16 object-contain"
                                    />
                                </div>
                                <h1 className="text-xl font-bold text-[#facc15]">
                                    ระบบบริหารงานสืบสวนคดีอาญา
                                </h1>
                                <p className="text-sm text-slate-300 mt-1">
                                    กองกำกับการ 1 กองบังคับการปฏิบัติการพิเศษ
                                </p>
                            </div>

                            <form onSubmit={handleLogin} className="p-6 sm:p-8">
                                <div className="text-center mb-6">
                                    <h2 className="text-xl font-bold text-slate-800">เข้าสู่ระบบ</h2>
                                    <p className="text-sm text-slate-500 mt-1">
                                        กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน
                                    </p>
                                </div>

                                <div className="mb-4">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                                        Username
                                    </label>
                                    <input
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        autoComplete="username"
                                        autoCapitalize="none"
                                        spellCheck="false"
                                        placeholder="กรอก Username"
                                        className="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                        required
                                    />
                                </div>

                                <div className="mb-4">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">
                                        Password
                                    </label>
                                    <div className="relative">
                                        <input
                                            type={showPassword ? "text" : "password"}
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            autoComplete="current-password"
                                            placeholder="กรอก Password"
                                            className="w-full border border-slate-300 rounded-lg px-4 py-3 pr-16 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            required
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500 hover:text-slate-800 px-2 py-1"
                                        >
                                            {showPassword ? 'ซ่อน' : 'แสดง'}
                                        </button>
                                    </div>
                                </div>

                                {error && (
                                    <div className="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm font-semibold">
                                        ⚠️ {error}
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-lg transition-colors"
                                >
                                    🔐 เข้าสู่ระบบ
                                </button>

                                <div className="mt-6 text-center text-xs text-slate-400">
                                    ระบบบริหารงานสืบสวนคดีอาญา © 2026
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [loggedIn, setLoggedIn] = React.useState(
                () => sessionStorage.getItem('cibssd_logged_in') === 'true'
            );

            if (!loggedIn) {
                return <LoginScreen onLogin={() => setLoggedIn(true)} />;
            }

            return <ChecklistApp />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <script>
        window.addEventListener('error', function (event) {
            console.error('Application error:', event.error || event.message);
            const root = document.getElementById('root');
            if (root && !root.innerHTML.trim()) {
                root.innerHTML = `
                    <div style="font-family:Sarabun,Arial,sans-serif;max-width:760px;margin:60px auto;padding:24px">
                        <div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)">
                            <h2 style="margin:0 0 12px;color:#b91c1c">ไม่สามารถโหลดระบบได้</h2>
                            <p style="color:#4b5563;line-height:1.7">
                                หน้าเว็บเกิดข้อผิดพลาดขณะโหลด JavaScript กรุณาเปิด Developer Tools
                                (F12) เพื่อตรวจสอบ Console
                            </p>
                            <button onclick="location.reload()" style="background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer">
                                โหลดหน้าเว็บใหม่
                            </button>
                        </div>
                    </div>`;
            }
        });
    </script>

</body>
</html>
